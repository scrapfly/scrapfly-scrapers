name: Scraper Tests
on:
  workflow_dispatch:
    inputs:
      scrapers:
        description: "Only these scrapers, comma-separated (e.g. airbnb,expedia). Empty runs all of them."
        required: false
        default: ""
      tests:
        description: "Only these test functions, comma-separated (e.g. test_search_scraping). Empty runs all of them."
        required: false
        default: ""
  schedule:
    - cron: '0 0 * * *'

jobs:
  matrix:
    # one job per test function found in the *-scraper/test.py files (see .github/scripts/test_matrix.py)
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.generate.outputs.include }}
    steps:
    - uses: actions/checkout@v4
    - id: generate
      run: python3 .github/scripts/test_matrix.py --scrapers "${{ inputs.scrapers }}" --tests "${{ inputs.tests }}" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the Slack message links to the job's own log (its id comes from the API)
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 - --version 2.1.3
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache Poetry virtual environment
      uses: actions/cache@v4
      id: cache
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/${{ matrix.project_dir }}/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        cd ${{ matrix.project_dir }}
        poetry install --no-root

    - name: Run test
      env:
        SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
      # 3 script lines: slack_message.py counts them to link the Slack message to pytest's FAILED line of this log
      run: |
        cd ${{ matrix.project_dir }}
        set -o pipefail  # the step fails with pytest, not with tee
        poetry run pytest test.py -k ${{ matrix.test }} 2>&1 | tee pytest.log

    - name: Compose the Slack message
      # "Scraper Tests" linked to the run, the scraper linked to this job's log at the failure, the test linked to its
      # code, and the status (see .github/scripts/slack_message.py)
      id: slack
      if: failure() && github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        python3 .github/scripts/slack_message.py --repo ${{ github.repository }} --run-id ${{ github.run_id }}
        --sha ${{ github.sha }} --dir ${{ matrix.project_dir }} --test ${{ matrix.test }}
        --pytest-log ${{ matrix.project_dir }}/pytest.log >> "$GITHUB_OUTPUT"

    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      if: failure() && github.event_name == 'schedule'
      with:
        status: custom
        fields: workflowRun
        custom_payload: |
          {
            text: "",
            attachments: [{
              color: "danger",
              mrkdwn_in: ["text"],
              fallback: process.env.SLACK_FALLBACK || `${{ matrix.project_dir }}: ${{ matrix.test }} failed`,
              text: process.env.SLACK_TEXT || `${process.env.AS_WORKFLOW_RUN} ${{ matrix.project_dir }}: ${{ matrix.test }}`,
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SLACK_TEXT: ${{ steps.slack.outputs.text }}
        SLACK_FALLBACK: ${{ steps.slack.outputs.fallback }}

  status:
    # after the nightly: one badge file per scraper on the ci-status branch (the README status column reads them),
    # and the README table ordered by the results (passing scrapers first, failing and not run ones last)
    needs: test
    # the nightly, or a manual run of the whole matrix (e.g. right after this job is first merged)
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scrapers == '' && inputs.tests == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}  # the branch as it is now, so the README commit below goes on top of it

    - name: Check out the ci-status branch (created on the first run)
      run: |
        git clone -q --depth 1 --branch ci-status "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status \
          || (mkdir ci-status && git -C ci-status init -q -b ci-status)

    - name: Write the status files
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/ci_status.py --repo ${{ github.repository }} --run-id ${{ github.run_id }} --out ci-status

    - name: Push the ci-status branch
      run: |
        cd ci-status
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "Scraper Tests run ${{ github.run_id }} ($(date -u +%F))"
        git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-status

    - name: Order the README tables by the results
      # a commit on the branch only when the order changed (a push with the workflow token starts no other workflow)
      run: |
        python3 .github/scripts/docs.py --status ci-status/status.json
        git diff --quiet README.md docs/ && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -q -m "Scraper Tests run ${{ github.run_id }}: order the README table by the results" README.md docs/
        git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
