name: Docs

# The README scraper table and llms.txt are generated by .github/scripts/docs.py from the scraper folders and
# .github/scrapers.json. This check fails when a change to those was not followed by a run of the script.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check that the README table and llms.txt are up to date
      run: python3 .github/scripts/docs.py --check
