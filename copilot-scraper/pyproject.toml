[tool.poetry]
name = "scrapfly-copilot"
version = "0.1.0"
description = "demo cloud browser scraper for copilot.microsoft.com using Scrapfly and Playwright"
authors = ["Scrapfly <abdelrahman@scrapfly.io>"]
license = "NPOS-3.0"

[tool.poetry.dependencies]
python = "^3.10"
scrapfly-sdk = {extras = ["browser"], version = "^0.10.5"}
loguru = "^0.7.1"
parsel = "^1.9.0"

[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
pytest = "^7.3.1"
cerberus = "^1.3.4"
asyncio = "^3.4.3"
pytest-asyncio = "^0.21.0"
pytest-rerunfailures = "^14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
python_files = "test.py"

[tool.black]
line-length = 120
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
